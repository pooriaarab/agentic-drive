name: publish

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check the publish tokens
        run: |
          test -n "$NPM_TOKEN" || { echo "NPM_TOKEN is not set"; exit 1; }
          test -n "$ANTS_TOKEN" || { echo "ANTS_TOKEN is not set"; exit 1; }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ANTS_TOKEN: ${{ secrets.ANTS_TOKEN }}
      - name: Publish if version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm view "$NAME@$VER" version >/dev/null 2>&1 \
            && echo "already published, skipping" \
            || npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to ants.land
        run: |
          printf '\n//npm.ants.land/:_authToken=%s\n' "$ANTS_TOKEN" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version --registry https://npm.ants.land >/dev/null 2>&1; then
            echo "$NAME@$VER on ants.land; skipping."
          else
            npm publish --access public --ignore-scripts --registry https://npm.ants.land
          fi
        env:
          ANTS_TOKEN: ${{ secrets.ANTS_TOKEN }}
